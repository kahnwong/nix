# ------------------------------------------------------------------------------
# /etc/tlp.conf - ThinkPad X13 Gen 6 AMD (Ryzen AI 7 PRO 350 w/ Radeon 860M)
# Tuned for maximum battery efficiency on BAT, full performance on AC.
# Driver: amd-pstate-epp (active mode) | Sleep: s2idle only (no S3/deep)
# ------------------------------------------------------------------------------

# Enable TLP out of the box
TLP_ENABLE=1

# ------------------------------------------------------------------------------
# CPU Tuning & Power Management (amd-pstate-epp)
# ------------------------------------------------------------------------------

# Only 'performance' and 'powersave' are valid governors for amd-pstate-epp.
CPU_SCALING_GOVERNOR_ON_AC=performance
CPU_SCALING_GOVERNOR_ON_BAT=powersave

# Energy Performance Preference (EPP)
# 'performance' on AC for lowest latency; 'power' on BAT is the most aggressive
# power-saving preference supported by this CPU (favors efficiency cores/clocks).
CPU_ENERGY_PERF_POLICY_ON_AC=performance
CPU_ENERGY_PERF_POLICY_ON_BAT=power

# ACPI Platform Profiles (firmware-level power envelope)
PLATFORM_PROFILE_ON_AC=performance
PLATFORM_PROFILE_ON_BAT=low-power

# AMD Core Performance Boost (CPB / Turbo)
# Enabled on AC for raw speed; disabled on battery to cut power spikes.
CPU_BOOST_ON_AC=1
CPU_BOOST_ON_BAT=0

# Hardware Controlled Performance States (HWP) Dynamic Boost
CPU_HWP_DYN_BOOST_ON_AC=1
CPU_HWP_DYN_BOOST_ON_BAT=0

# Disable NMI watchdog to save a small amount of power.
NMI_WATCHDOG=0

# ------------------------------------------------------------------------------
# Graphics (AMD Radeon 860M)
# ------------------------------------------------------------------------------

# AMDGPU panel power savings (ABM). 0 = off (best color on AC),
# 3 = strong panel power savings on battery with minimal visible impact.
# The eDP panel is one of the largest battery drains, so this is a big win.
AMDGPU_ABM_LEVEL_ON_AC=0
AMDGPU_ABM_LEVEL_ON_BAT=3

# ------------------------------------------------------------------------------
# Connectivity & Radios (Wi-Fi and Bluetooth kept enabled)
# ------------------------------------------------------------------------------

# Never disable/power down Wi-Fi / Bluetooth on startup or on battery.
DEVICES_TO_DISABLE_ON_STARTUP=""
DEVICES_TO_DISABLE_ON_BAT=""
DEVICES_TO_DISABLE_ON_BAT_NOT_IN_USE=""

# Wi-Fi power saving: off on AC for lowest latency; on on BAT to save power.
# The radio stays connected; only the NIC's power-save mode is enabled.
WIFI_PWR_ON_AC=off
WIFI_PWR_ON_BAT=on

# Disable Wake-on-LAN (not needed on a laptop, saves a little power).
WOL_DISABLE=Y

# Keep Bluetooth USB controllers out of USB autosuspend to avoid disconnects.
USB_EXCLUDE_BTUSB=1

# ------------------------------------------------------------------------------
# Storage, PCIe & Disk Writeback
# ------------------------------------------------------------------------------

# PCIe Active State Power Management (ASPM).
PCIE_ASPM_ON_AC=performance
PCIE_ASPM_ON_BAT=powersupersave

# AHCI/NVMe link power management.
SATA_LINKPWR_ON_AC=max_performance
SATA_LINKPWR_ON_BAT=min_power

# Runtime Power Management for PCIe devices.
RUNTIME_PM_ON_AC=on
RUNTIME_PM_ON_BAT=auto

# Batch disk writes to let the disk/SoC idle longer on battery.
MAX_LOST_WORK_SECS_ON_AC=15
MAX_LOST_WORK_SECS_ON_BAT=60

# ------------------------------------------------------------------------------
# USB
# ------------------------------------------------------------------------------

# Enable USB autosuspend globally (TLP has no per-AC/BAT variant for this).
# Bluetooth controllers are excluded below to prevent disconnects.
USB_AUTOSUSPEND=1

# ------------------------------------------------------------------------------
# Audio
# ------------------------------------------------------------------------------
SOUND_POWER_SAVE_ON_AC=0
SOUND_POWER_SAVE_ON_BAT=1
SOUND_POWER_SAVE_CONTROLLER=Y

# ------------------------------------------------------------------------------
# Battery Charge Thresholds (ThinkPad specific, BAT0)
# ------------------------------------------------------------------------------

# Longevity-friendly window. Note: Lenovo firmware on this model does not honor
# an 80% stop threshold, so 100% is used as the effective ceiling.
START_CHARGE_THRESH_BAT0=50
STOP_CHARGE_THRESH_BAT0=100
