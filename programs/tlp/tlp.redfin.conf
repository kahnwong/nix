# ------------------------------------------------------------------------------
# /etc/tlp.conf - Optimized for AMD Ryzen AI 7 PRO 350 (No Performance Limits on AC)
# ------------------------------------------------------------------------------

# Enable TLP out of the box
TLP_ENABLE=1

# ------------------------------------------------------------------------------
# CPU Tuning & Power Management (amd-pstate-epp)
# ------------------------------------------------------------------------------

# Unlocked maximum performance governor on AC; dynamic scaling on Battery
CPU_SCALING_GOVERNOR_ON_AC=performance
CPU_SCALING_GOVERNOR_ON_BAT=powersave

# Set the Energy Performance Preference (EPP)
# 'performance' forces the hardware to favor lowest latency and max clocks on AC
CPU_ENERGY_PERF_POLICY_ON_AC=performance
CPU_ENERGY_PERF_POLICY_ON_BAT=balance_power

# ACPI Platform Profiles (Firmware/BIOS behavior)
PLATFORM_PROFILE_ON_AC=performance
PLATFORM_PROFILE_ON_BAT=low-power

# AMD Core Performance Boost (CPB / Turbo)
# Enabled on AC for raw speed; disabled on battery to protect runtime
CPU_BOOST_ON_AC=1
CPU_BOOST_ON_BAT=0

# Hardware Controlled Performance States (HWP) Dynamic Boost
CPU_HWP_DYN_BOOST_ON_AC=1
CPU_HWP_DYN_BOOST_ON_BAT=0

# ------------------------------------------------------------------------------
# Connectivity & Radios (Wi-Fi and Bluetooth Fixed Always-On)
# ------------------------------------------------------------------------------

# Absolutely do NOT disable or power down Wi-Fi / Bluetooth on startup or change
DEVICES_TO_DISABLE_ON_STARTUP=""
DEVICES_TO_DISABLE_ON_SHUTDOWN=""
DEVICES_TO_DISABLE_ON_BAT=""
DEVICES_TO_DISABLE_ON_BAT_NOT_IN_USE=""

# Force Wi-Fi power saving completely OFF on both AC and Battery to prevent drops
WIFI_PWR_ON_AC=off
WIFI_PWR_ON_BAT=off

# Prevent USB/PCIe autosuspend for Bluetooth controllers to ensure zero disconnects
USB_EXCLUDE_BTUSB=1

# ------------------------------------------------------------------------------
# Storage, PCIe & Graphics
# ------------------------------------------------------------------------------

# PCIe Active State Power Management (ASPM)
# 'performance' completely disables power saving on PCIe lanes while plugged in
PCIE_ASPM_ON_AC=performance
PCIE_ASPM_ON_BAT=powersupersave

# Radeon Dynamic Power Management (Radeon 860M)
RADEON_DPM_PERF_LEVEL_ON_AC=high
RADEON_DPM_PERF_LEVEL_ON_BAT=auto

# AHCI Link Power Management
SATA_LINKPWR_ON_AC=max_performance
SATA_LINKPWR_ON_BAT=min_power

# Host Controller Runtime Power Management
RUNTIME_PM_ON_AC=on
RUNTIME_PM_ON_BAT=auto

# ------------------------------------------------------------------------------
# Audio
# ------------------------------------------------------------------------------
SOUND_POWER_SAVE_ON_AC=0
SOUND_POWER_SAVE_ON_BAT=1
SOUND_POWER_SAVE_CONTROLLER=Y

START_CHARGE_THRESH_BAT0=50
STOP_CHARGE_THRESH_BAT0=100 # should be 80, but lenovo firmware demands it so otherwise
