# ==============================================================================
# TLP PROFILE — ThinkPad X13 Gen 1 AMD (Ryzen 5 PRO 4650U, Renoir / Zen 2)
# ------------------------------------------------------------------------------
# Verified hardware facts on this machine:
#   * CPU scaling driver : acpi-cpufreq  (amd-pstate/EPP NOT active)
#   * Governors available: conservative ondemand userspace powersave performance schedutil
#   * Sleep modes        : s2idle ONLY  (no 'deep'/S3 in this BIOS)
#   * platform_profile   : low-power balanced performance
#   * Charge thresholds  : start/stop supported (BAT0)
# Tuned for maximum battery efficiency on BAT, full performance on AC.
# ==============================================================================

# Enable TLP.
TLP_ENABLE=1

# ------------------------------------------------------------------------------
# CPU — scaling governor (acpi-cpufreq)
# ------------------------------------------------------------------------------
# 'performance' on AC (race-to-idle), 'powersave' governor on battery.
CPU_SCALING_GOVERNOR_ON_AC=performance
CPU_SCALING_GOVERNOR_ON_BAT=powersave

# --- Energy Performance Preference (EPP) ---
# NOTE: This machine uses the 'acpi-cpufreq' driver, which does NOT implement
# EPP. These directives are intentionally left commented so TLP does not emit
# warnings and to document intent should amd-pstate-epp be enabled later.
# CPU_ENERGY_PERF_POLICY_ON_AC=performance
# CPU_ENERGY_PERF_POLICY_ON_BAT=power

# Only 3 P-states are exposed (2.1 / 1.7 / 1.4 GHz). Hard-capping frequency
# hurts race-to-idle here, so let the governor + boost toggle do the work.
# CPU_SCALING_MAX_FREQ_ON_BAT=

# AMD Core Performance Boost (turbo).
# On for AC responsiveness; OFF on battery to cut peak power draw. This is one
# of the biggest single battery wins on Renoir.
CPU_BOOST_ON_AC=1
CPU_BOOST_ON_BAT=0

# HWP dynamic boost is an intel_pstate feature; harmless but documented off.
# CPU_HWP_DYN_BOOST_ON_AC / _ON_BAT are not applicable to acpi-cpufreq.

# Prefer power-efficient task placement on battery.
SCHED_POWERSAVE_ON_AC=0
SCHED_POWERSAVE_ON_BAT=1

# Disable NMI watchdog (tiny power saving, not needed on a laptop).
NMI_WATCHDOG=0

# ------------------------------------------------------------------------------
# Platform profile (ACPI firmware power envelope)
# ------------------------------------------------------------------------------
PLATFORM_PROFILE_ON_AC=performance
PLATFORM_PROFILE_ON_BAT=low-power

# ------------------------------------------------------------------------------
# Graphics — AMD Radeon (Renoir eDP panel)
# ------------------------------------------------------------------------------
# ABM (Adaptive Backlight Management): 0 = off for best color on AC,
# 3 = strong panel power saving on battery. The eDP backlight is a top drain.
AMDGPU_ABM_LEVEL_ON_AC=0
AMDGPU_ABM_LEVEL_ON_BAT=3

# Radeon DPM performance level (fallback for radeon/amdgpu DPM).
RADEON_DPM_PERF_LEVEL_ON_AC=auto
RADEON_DPM_PERF_LEVEL_ON_BAT=low

# ------------------------------------------------------------------------------
# Kernel / Sleep
# ------------------------------------------------------------------------------
# This BIOS exposes s2idle ONLY. Setting 'deep' here would fail — do not.
MEM_SLEEP_ON_AC=s2idle
MEM_SLEEP_ON_BAT=s2idle

# ------------------------------------------------------------------------------
# Disk / PCIe / Storage
# ------------------------------------------------------------------------------
# Batch writeback to let the SoC/NVMe idle longer on battery.
MAX_LOST_WORK_SECS_ON_AC=15
MAX_LOST_WORK_SECS_ON_BAT=60

# NVMe/SATA link power management.
SATA_LINKPWR_ON_AC=med_power_with_dipm
SATA_LINKPWR_ON_BAT=min_power

# Spin down idle disks quickly on battery.
DISK_IDLE_SECS_ON_AC=0
DISK_IDLE_SECS_ON_BAT=2

# PCIe Active State Power Management.
PCIE_ASPM_ON_AC=default
PCIE_ASPM_ON_BAT=powersupersave

# Runtime PM for PCIe devices — allow autosuspend on battery.
RUNTIME_PM_ON_AC=on
RUNTIME_PM_ON_BAT=auto

# ------------------------------------------------------------------------------
# Audio
# ------------------------------------------------------------------------------
SOUND_POWER_SAVE_ON_AC=0
SOUND_POWER_SAVE_ON_BAT=1
SOUND_POWER_SAVE_CONTROLLER=Y

# ------------------------------------------------------------------------------
# Networking & Radios
# ------------------------------------------------------------------------------
WOL_DISABLE=Y

# Wi-Fi NIC power saving: off on AC (latency), on on BAT (power). Stays connected.
WIFI_PWR_ON_AC=off
WIFI_PWR_ON_BAT=on

# Power down radios that aren't in use while on battery (extra savings).
# Bluetooth and WWAN are released when idle; they re-enable on demand.
DEVICES_TO_DISABLE_ON_BAT_NOT_IN_USE="wwan"

# ------------------------------------------------------------------------------
# USB
# ------------------------------------------------------------------------------
USB_AUTOSUSPEND=1
# Keep Bluetooth USB controllers out of autosuspend to avoid disconnects.
USB_EXCLUDE_BTUSB=1

# ------------------------------------------------------------------------------
# Battery Charge Thresholds (ThinkPad specific, BAT0)
# ------------------------------------------------------------------------------
# Longevity-friendly charge window (reduces calendar/cycle wear).
START_CHARGE_THRESH_BAT0=60
STOP_CHARGE_THRESH_BAT0=80
