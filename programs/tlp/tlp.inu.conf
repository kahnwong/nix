# ==============================================================================
# OPTIMIZED TLP PROFILE FOR AMD RYZEN 5 PRO 4650U (RENOIR)
# ==============================================================================

# --- CPU Scaling & Driver for Zen 2 ---
CPU_SCALING_GOVERNOR_ON_AC=performance
CPU_SCALING_GOVERNOR_ON_BAT=powersave

# Because 'passive' mode doesn't use EPP, comment this out to avoid errors:
# CPU_ENERGY_PERF_POLICY_ON_AC=performance
# CPU_ENERGY_PERF_POLICY_ON_BAT=powersave

# Do not hard-cap MAX freq too low (like 1.2GHz). It hurts "race-to-idle".
# Instead, let EPP and Platform Profiles handle the energy limits naturally.
# Commenting these out lets the system scale dynamically and efficiently.
# CPU_SCALING_MIN_FREQ_ON_AC=
# CPU_SCALING_MAX_FREQ_ON_AC=
# CPU_SCALING_MIN_FREQ_ON_BAT=
# CPU_SCALING_MAX_FREQ_ON_BAT=

# --- Energy Performance Preferences (EPP) ---
# This is the most effective way to save power on Ryzen without destroying usability.
CPU_ENERGY_PERF_POLICY_ON_AC=performance
CPU_ENERGY_PERF_POLICY_ON_BAT=power

# Core boosting
CPU_BOOST_ON_AC=1
CPU_BOOST_ON_BAT=0

# --- Process Scheduling ---
SCHED_POWERSAVE_ON_AC=0
SCHED_POWERSAVE_ON_BAT=1

# --- Platform Profiles (ACPI / ThinkPad Framework) ---
PLATFORM_PROFILE_ON_AC=performance
PLATFORM_PROFILE_ON_BAT=low-power

# --- Graphics (AMD Radeon) ---
# AMD Display Core Display Brightness (ABM) panel power saving.
# 3 is perfectly stable and highly efficient on Renoir panels.
AMDGPU_ABM_LEVEL_ON_AC=0
AMDGPU_ABM_LEVEL_ON_BAT=3

# --- Kernel & Sleep ---
# CRITICAL: Ryzen 4000 series (Renoir) historically struggles with 's2idle' power drain
# on Linux. 'deep' (S3) is highly recommended if your ThinkPad BIOS supports it.
MEM_SLEEP_ON_AC=s2idle
MEM_SLEEP_ON_BAT=deep

# --- Disk & PCIe ---
MAX_LOST_WORK_SECS_ON_AC=15
MAX_LOST_WORK_SECS_ON_BAT=60

PCIE_ASPM_ON_AC=default
PCIE_ASPM_ON_BAT=powersupersave

# Runtime Power Management for PCIe devices
RUNTIME_PM_ON_AC=on
RUNTIME_PM_ON_BAT=auto

# --- Audio ---
SOUND_POWER_SAVE_ON_AC=0
SOUND_POWER_SAVE_ON_BAT=1
SOUND_POWER_SAVE_CONTROLLER_ON_BAT=Y

# --- Networking & Wireless ---
NMI_WATCHDOG=0
WOL_DISABLE=Y

WIFI_PWR_ON_AC=off
WIFI_PWR_ON_BAT=on

# Radio management
# DEVICES_TO_DISABLE_ON_BAT_NOT_IN_USE=bluetooth wwan

# --- Battery Charge Thresholds (ThinkPad specific) ---
# Fixed the 100% stop threshold to prevent constant trickling / degradation.
START_CHARGE_THRESH_BAT0=60
STOP_CHARGE_THRESH_BAT0=80

# --- USB ---
USB_AUTOSUSPEND_ON_AC=0
USB_AUTOSUSPEND_ON_BAT=1
USB_EXCLUDE_BTUSB=1
