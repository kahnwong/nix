# ==============================================================================
# TLP PROFILE — Apple MacBook Air 13" (2017, A1466 / MacBookAir7,2)
# ------------------------------------------------------------------------------
# Verified hardware facts on this machine:
#   * CPU                : Intel Core i5-5250U (Broadwell-U, 2C/4T)
#   * CPU scaling driver : intel_pstate  (NO HWP -> no EPP support)
#   * Governors available: performance powersave  (ONLY these two)
#   * Turbo control      : intel_pstate/no_turbo (via CPU_BOOST_ON_*)
#   * GPU                : Intel HD Graphics 6000 (i915, intel_backlight)
#   * Sleep modes        : s2idle + deep  (deep = S3, current default)
#   * platform_profile   : NOT supported
#   * Charge thresholds  : NOT supported (Apple EC exposes no start/stop)
#   * Storage            : Samsung Apple AHCI SATA SSD (bus 04, behind RP #6)
#   * Wi-Fi              : Broadcom BCM4360 (wl) on bus 03, behind PCIe RP #3
#   * Bus fabric         : Intel Thunderbolt 2 (Falcon Ridge) bridges present
#   * Bluetooth          : Apple/Broadcom USB Bluetooth controller
#
# ------------------------------------------------------------------------------
# !!! STABILITY NOTE — READ BEFORE EDITING !!!
# This platform (Broadcom BCM4360 Wi-Fi behind a PCIe root port + a Thunderbolt 2
# bridge fabric) HARD-FREEZES under aggressive PCIe power management on Linux.
# Symptom: instant lockup with NOTHING written to the journal, boot sessions that
# die after seconds/minutes. The following are DELIBERATELY conservative:
#   * PCIE_ASPM_ON_BAT is NOT set to 'powersupersave'  (freeze trigger here)
#   * RUNTIME_PM_ON_BAT is kept 'on'                    (BCM4360 wl hangs on auto)
#   * SATA_LINKPWR_ON_BAT is NOT 'min_power'            (can hang the boot SSD)
# Change these ONLY after testing on battery with `journalctl -f` running.
# ------------------------------------------------------------------------------
# ==============================================================================

# Enable TLP.
TLP_ENABLE=1

# ------------------------------------------------------------------------------
# CPU — scaling governor (intel_pstate)
# ------------------------------------------------------------------------------
# intel_pstate exposes ONLY 'performance' and 'powersave'. 'powersave' is still a
# fully dynamic governor (not a hard low cap) and is the correct battery choice.
CPU_SCALING_GOVERNOR_ON_AC=performance
CPU_SCALING_GOVERNOR_ON_BAT=powersave

# EPP: NOT applicable (no HWP on Broadwell). Documented, left unset.
# CPU_ENERGY_PERF_POLICY_ON_AC=performance
# CPU_ENERGY_PERF_POLICY_ON_BAT=power

# intel_pstate performance window. Cap max P-state on battery to trim peak
# package power. This is safe (pure CPU throttle, no bus/link involvement).
CPU_MIN_PERF_ON_AC=0
CPU_MAX_PERF_ON_AC=100
CPU_MIN_PERF_ON_BAT=0
CPU_MAX_PERF_ON_BAT=70

# Turbo Boost (mapped to intel_pstate/no_turbo). On for AC, off on battery —
# the single biggest SAFE battery win on this CPU.
CPU_BOOST_ON_AC=1
CPU_BOOST_ON_BAT=0

# Disable NMI watchdog (tiny power saving, not needed on a laptop).
NMI_WATCHDOG=0

# ------------------------------------------------------------------------------
# Platform profile — NOT supported on this Mac. Do not set (would warn).
# ------------------------------------------------------------------------------

# ------------------------------------------------------------------------------
# Graphics — Intel HD Graphics 6000 (i915)
# ------------------------------------------------------------------------------
# INTEL_GPU_*_FREQ are validated against hardware min/max; a value of 0 is below
# the hardware minimum and errors out. Left UNSET so the i915 RPS governor (which
# already clocks the GPU down aggressively when idle) stays in charge — safe.
# To hard-cap on battery, use real MHz from 'tlp-stat -g':
# INTEL_GPU_MAX_FREQ_ON_BAT=<value>

# ------------------------------------------------------------------------------
# Kernel / Sleep
# ------------------------------------------------------------------------------
# Both s2idle and 'deep' (S3) are supported; 'deep' draws far less during
# suspend. This does not affect running-on-battery stability.
MEM_SLEEP_ON_AC=deep
MEM_SLEEP_ON_BAT=deep

# ------------------------------------------------------------------------------
# Disk / SATA / Storage (Samsung Apple AHCI SATA SSD)
# ------------------------------------------------------------------------------
# Batch writeback so the SSD idles longer on battery (safe, no link change).
MAX_LOST_WORK_SECS_ON_AC=15
MAX_LOST_WORK_SECS_ON_BAT=60

# SATA Aggressive Link Power Management.
# 'min_power' has been observed to hang the boot SSD link on Apple AHCI, so the
# battery setting uses the safer DIPM variant (still saves power, keeps the link
# responsive). Do NOT change ON_BAT to min_power without testing.
SATA_LINKPWR_ON_AC=med_power_with_dipm
SATA_LINKPWR_ON_BAT=med_power_with_dipm

# SSD: no mechanical spin-down; idle timers are no-ops.
DISK_IDLE_SECS_ON_AC=0
DISK_IDLE_SECS_ON_BAT=0

# ------------------------------------------------------------------------------
# PCIe  — CONSERVATIVE (see STABILITY NOTE)
# ------------------------------------------------------------------------------
# 'powersupersave' forces the deepest ASPM (L1.2) on all links including the
# BCM4360 Wi-Fi root port and the Thunderbolt 2 fabric, which hard-freezes this
# machine. 'default' honors firmware/BIOS ASPM (already power-aware) safely.
PCIE_ASPM_ON_AC=default
PCIE_ASPM_ON_BAT=default

# Runtime PM: keep devices powered ('on') on BOTH profiles. The BCM4360 'wl'
# driver and the Thunderbolt bridges lock up when runtime-suspended ('auto').
RUNTIME_PM_ON_AC=on
RUNTIME_PM_ON_BAT=on

# ------------------------------------------------------------------------------
# Audio  (safe)
# ------------------------------------------------------------------------------
SOUND_POWER_SAVE_ON_AC=0
SOUND_POWER_SAVE_ON_BAT=1
SOUND_POWER_SAVE_CONTROLLER=Y

# ------------------------------------------------------------------------------
# Networking & Radios  (safe)
# ------------------------------------------------------------------------------
WOL_DISABLE=Y

# Wi-Fi NIC power saving: off on AC, on on BAT. This is the *driver* power-save
# (802.11 PS-Poll), NOT PCIe power management, and is safe on BCM4360.
WIFI_PWR_ON_AC=off
WIFI_PWR_ON_BAT=on

# Do NOT auto-disable radios on battery — leave
# DEVICES_TO_DISABLE_ON_BAT_NOT_IN_USE unset (dropping BT/Wi-Fi mid-use here has
# caused instability).

# ------------------------------------------------------------------------------
# USB  (safe — BT controller excluded to avoid input disconnects)
# ------------------------------------------------------------------------------
USB_AUTOSUSPEND=1
USB_EXCLUDE_BTUSB=1
