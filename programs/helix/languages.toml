# ==============================================================================
# Languages
# ==============================================================================
[[language]]
name = "hcl"
language-servers = ["terraform-ls"]
language-id = "terraform"

[[language]]
name = "tfvars"
language-servers = ["terraform-ls"]
language-id = "terraform-vars"

[[language]]
name = "markdown"
language-servers = ["marksman", "wakatime"]
soft-wrap.enable = true

[[language]]
name = "rust"
language-servers = ["rust-analyzer", "wakatime"]

[[language]]
name = "go"
language-servers = ["gopls", "wakatime"]

[[language]]
name = "yaml"
language-servers = ["yaml-language-server", "wakatime"]

[[language]]
name = "dockerfile"
language-servers = ["docker-langserver", "wakatime"]

[[language]]
name = "docker-compose"
language-servers = ["docker-compose-langserver", "yaml-language-server", "wakatime"]

[[language]]
name = "toml"
language-servers = ["taplo", "wakatime"]
formatter = { command = "taplo", args = ["fmt", "-"] }

[[language]]
name = "bash"
language-servers = ["bash-language-server", "wakatime"]

# ==============================================================================
# Language Servers
# ==============================================================================
[language-server.wakatime]
command = "wakatime-ls"

[language-server.terraform-ls]
command = "terraform-ls"
args = ["serve"]

[language-server.yaml-language-server]
command = "yaml-language-server"
args = ["--stdio"]

[language-server.yaml-language-server.config.yaml]
format = { enable = true }
validation = true

[language-server.yaml-language-server.config.yaml.schemas]
"https://json.schemastore.org/github-workflow.json" = ".github/workflows/*.{yml,yaml}"
"https://raw.githubusercontent.com/ansible-community/schemas/main/f/ansible-tasks.json" = "roles/{tasks,handlers}/*.{yml,yaml}"
